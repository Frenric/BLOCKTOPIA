 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Would You Rather? — Communication Edition</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="prompt-screen" aria-live="polite">
      <section class="prompt-card" aria-labelledby="questionTitle">
        <h1 id="questionTitle">Would you rather work alone or with a team?</h1>

        <div class="choice-grid" role="group" aria-label="Answer choices">
          <button class="choice-button" type="button">Work alone</button>
          <button class="choice-button" type="button">Work with a team</button>
        </div>

        <div class="explain-panel hidden" id="explainPanel">
          <label for="reasonInput">Why?</label>
          <textarea id="reasonInput" rows="4" placeholder="Tell us your reason..."></textarea>
          <button class="submit-button" id="submitReason" type="button">Submit</button>
        </div>

        <div class="response-card hidden" id="responseCard" aria-live="polite">
          <p class="response-label">Your answer</p>
          <h2 id="selectedAnswerText">Work with a team</h2>
          <p id="reasonText">I like collaborating because ideas become stronger when people share feedback.</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
