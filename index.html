<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocktopia UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Start screen with the Blocktopia logo and game choices. -->
    <div class="start-screen" id="startScreen">
      <div class="game-menu">
        <div class="menu-header">
          <img class="brand-image" src="blocktopia.jpg" alt="Blocktopia" />
          <p class="menu-label">School Arcade</p>
          <h1>Welcome to Block<span>topia</span></h1>
          <p class="menu-subtitle">Pick a challenge and let the learning adventure begin!</p>
        </div>
        <h2>Choose Your Game</h2>
        <div class="game-grid">
          <button class="game-card selected" type="button" data-game="Memory Match">
            <span class="game-icon">◆</span>
            <span class="game-name">Memory Match</span>
            <span class="game-tag">Focus</span>
          </button>
        </div>
      </div>
    </div>

    <!-- This area is filled with the selected game by script.js. -->
    <div class="game-shell" id="gameShell">
      <button class="back-button" id="backButton" type="button">← BACK</button>
      <main class="activity-screen" id="activityScreen" aria-live="polite"></main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
